<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <title>Customer Due Manager | Pakistan</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:'Segoe UI',sans-serif;background:linear-gradient(135deg,#1e3c72 0%,#2a5298 100%);min-height:100vh;}
        
        .login-screen{position:fixed;top:0;left:0;width:100%;height:100%;background:linear-gradient(135deg,#1e3c72 0%,#2a5298 100%);display:flex;align-items:center;justify-content:center;z-index:2000;}
        .login-card{background:white;border-radius:24px;padding:40px;width:90%;max-width:400px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.3);}
        .login-icon{width:80px;height:80px;background:linear-gradient(135deg,#1e3c72,#2a5298);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;}
        .login-icon i{font-size:40px;color:white;}
        .login-card h2{color:#1a1a2e;}
        .login-card p{color:#666;margin-bottom:25px;}
        .login-input{width:100%;padding:14px;margin:10px 0;border:2px solid #e0e0e0;border-radius:12px;}
        .login-input:focus{outline:none;border-color:#1e3c72;}
        .login-btn{width:100%;background:linear-gradient(135deg,#1e3c72,#2a5298);color:white;border:none;padding:14px;border-radius:12px;cursor:pointer;font-weight:600;}
        .login-error{color:#dc3545;margin-top:10px;display:none;}
        
        .app{max-width:1400px;margin:0 auto;min-height:100vh;background:#f0f2f5;display:none;}
        .app-header{background:white;padding:16px 24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;box-shadow:0 2px 8px rgba(0,0,0,0.08);}
        .logo{display:flex;align-items:center;gap:12px;}
        .logo i{font-size:28px;color:#1e3c72;}
        .logo h1{font-size:1.4rem;color:#1a1a2e;}
        .pkr-badge{background:#28a745;color:white;font-size:0.7rem;padding:3px 8px;border-radius:20px;}
        .user-info{display:flex;align-items:center;gap:10px;background:#f0f2f5;padding:8px 15px;border-radius:30px;}
        .role-badge{padding:2px 8px;border-radius:20px;font-size:0.7rem;}
        .role-badge.admin{background:#dc3545;color:white;}
        .role-badge.user{background:#28a745;color:white;}
        .logout-btn{background:none;border:none;color:#dc3545;cursor:pointer;}
        
        .main-container{padding:20px;display:flex;gap:20px;flex-wrap:wrap;}
        .list-view{flex:1;min-width:280px;}
        .side-panels{width:320px;display:flex;flex-direction:column;gap:20px;}
        
        .stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:24px;}
        .stat-card{background:white;border-radius:16px;padding:18px;display:flex;align-items:center;gap:15px;box-shadow:0 2px 8px rgba(0,0,0,0.05);}
        .stat-icon{width:50px;height:50px;background:#e8eaf6;border-radius:12px;display:flex;align-items:center;justify-content:center;}
        .stat-icon i{font-size:24px;color:#1e3c72;}
        .stat-info{flex:1;}
        .stat-label{font-size:0.75rem;color:#666;}
        .stat-value{font-size:1.4rem;font-weight:bold;color:#1a1a2e;}
        
        .search-section{background:white;border-radius:16px;padding:16px;margin-bottom:20px;display:flex;gap:12px;flex-wrap:wrap;align-items:center;}
        .search-box{flex:3;position:relative;min-width:200px;}
        .search-box i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#999;}
        .search-box input{width:100%;padding:12px 12px 12px 42px;border:2px solid #e0e0e0;border-radius:12px;}
        .mic-btn{background:#1e3c72;color:white;border:none;width:45px;height:45px;border-radius:12px;cursor:pointer;}
        .mic-btn.listening{background:#dc3545;animation:pulse 1s infinite;}
        @keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.05);}}
        .filter-group{display:flex;gap:8px;flex-wrap:wrap;}
        .filter-btn{padding:8px 18px;border:2px solid #e0e0e0;background:white;border-radius:25px;cursor:pointer;}
        .filter-btn.active{background:#1e3c72;color:white;}
        .add-customer-btn{background:linear-gradient(135deg,#1e3c72,#2a5298);color:white;border:none;padding:10px 22px;border-radius:12px;cursor:pointer;}
        
        .table-container{background:white;border-radius:16px;overflow-x:auto;}
        .customers-table{width:100%;border-collapse:collapse;min-width:800px;}
        .customers-table th{padding:14px;text-align:left;border-bottom:2px solid #e0e0e0;}
        .customers-table td{padding:12px 14px;border-bottom:1px solid #e0e0e0;}
        .due-row{border-left:3px solid #dc3545;}
        .due-amount-value{color:#dc3545;font-weight:600;}
        .action-buttons{display:flex;gap:8px;}
        .action-btn{background:none;border:none;padding:6px 10px;border-radius:8px;cursor:pointer;}
        .receive-action{color:#28a745;}
        .edit-action{color:#ffc107;}
        .delete-action{color:#dc3545;}
        
        .reminder-panel,.collection-panel{background:white;border-radius:16px;overflow:hidden;}
        .reminder-header{background:linear-gradient(135deg,#ff6b6b,#ee5a24);color:white;padding:15px;display:flex;justify-content:space-between;}
        .collection-header{background:linear-gradient(135deg,#28a745,#20c997);color:white;padding:15px;display:flex;justify-content:space-between;}
        .reminder-list,.collection-list{max-height:350px;overflow-y:auto;}
        .reminder-item{padding:12px;border-bottom:1px solid #eee;display:flex;gap:10px;align-items:center;}
        .collection-empty{padding:30px;text-align:center;color:#999;}
        
        .modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);display:flex;align-items:center;justify-content:center;z-index:3000;display:none;}
        .modal-container{background:white;border-radius:24px;width:90%;max-width:500px;max-height:85vh;overflow-y:auto;}
        .modal-header{padding:20px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;}
        .modal-body{padding:20px;}
        .modal-footer{padding:20px;border-top:1px solid #eee;display:flex;gap:10px;justify-content:flex-end;}
        .form-group{margin-bottom:15px;}
        .form-group label{display:block;margin-bottom:5px;font-weight:500;}
        .form-group input,.form-group select{width:100%;padding:10px;border:2px solid #e0e0e0;border-radius:10px;}
        
        .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);color:white;padding:12px 24px;border-radius:50px;z-index:4000;display:none;}
        
        @media (max-width:768px){.main-container{flex-direction:column;}.side-panels{width:100%;}}
    </style>
</head>
<body>

<!-- Login Screen -->
<div class="login-screen" id="loginScreen">
    <div class="login-card">
        <div class="login-icon"><i class="fas fa-hand-holding-usd"></i></div>
        <h2>Customer Due Manager</h2>
        <p>Pakistan Payment Collection System</p>
        
        <select id="loginRole" class="login-input">
            <option value="admin">👑 Administrator</option>
            <option value="user">👤 Staff User</option>
        </select>
        <input type="text" id="loginUsername" class="login-input" placeholder="Username" value="admin">
        <input type="password" id="loginPassword" class="login-input" placeholder="Password" value="admin123">
        <button class="login-btn" id="loginBtn"><i class="fas fa-sign-in-alt"></i> Login</button>
        <div class="login-error" id="loginError">Invalid credentials</div>
    </div>
</div>

<!-- Main App -->
<div class="app" id="app">
    <div class="app-header">
        <div class="logo"><i class="fas fa-hand-holding-usd"></i><h1>Customer Due Manager <span class="pkr-badge">PKR</span></h1></div>
        <div class="user-info" id="userInfo"></div>
    </div>

    <div class="main-container">
        <div class="list-view">
            <div class="stats-grid">
                <div class="stat-card"><div class="stat-icon"><i class="fas fa-users"></i></div><div class="stat-info"><span class="stat-label">Total Customers</span><span class="stat-value" id="totalCustomers">0</span></div></div>
                <div class="stat-card"><div class="stat-icon"><i class="fas fa-rupee-sign"></i></div><div class="stat-info"><span class="stat-label">Total Due</span><span class="stat-value" id="totalAmount">PKR 0</span></div></div>
                <div class="stat-card"><div class="stat-icon"><i class="fas fa-exclamation-circle"></i></div><div class="stat-info"><span class="stat-label">Remaining Due</span><span class="stat-value" id="totalDue">PKR 0</span></div></div>
            </div>

            <div class="search-section">
                <div class="search-box"><i class="fas fa-search"></i><input type="text" id="searchInput" placeholder="Search by name, phone, city..."></div>
                <button class="mic-btn" id="micBtn"><i class="fas fa-microphone"></i></button>
                <div class="filter-group">
                    <button class="filter-btn active" data-filter="all">All</button>
                    <button class="filter-btn" data-filter="due">Has Due</button>
                    <button class="filter-btn" data-filter="cleared">Cleared</button>
                </div>
                <button class="add-customer-btn" id="showAddBtn"><i class="fas fa-plus"></i> Add Customer</button>
            </div>

            <div class="table-container">
                <table class="customers-table">
                    <thead><tr><th>ID</th><th>Name</th><th>CNIC</th><th>City</th><th>Phone</th><th>Reference</th><th>Due (PKR)</th><th>Actions</th></tr></thead>
                    <tbody id="customersList"><tr><td colspan="8" class="collection-empty">Loading...</td></tr></tbody>
                </table>
            </div>
        </div>

        <div class="side-panels">
            <div class="reminder-panel"><div class="reminder-header"><h3><i class="fas fa-bell"></i> Reminders</h3><span id="reminderCount">0</span></div><div id="reminderList" class="reminder-list"></div></div>
            <div class="collection-panel"><div class="collection-header"><h3><i class="fas fa-money-bill-wave"></i> Today's Collection</h3><span id="todayCollectionTotal">PKR 0</span></div><div id="todayCollectionList" class="collection-list"></div></div>
        </div>
    </div>
</div>

<!-- Add Customer Modal -->
<div class="modal-overlay" id="customerModal">
    <div class="modal-container">
        <div class="modal-header"><h3>Add Customer</h3><button class="modal-close" onclick="closeModal()">&times;</button></div>
        <div class="modal-body">
            <input type="hidden" id="editId">
            <div class="form-group"><label>Name *</label><input type="text" id="custName" placeholder="Full name"></div>
            <div class="form-group"><label>CNIC</label><input type="text" id="custCNIC" placeholder="CNIC"></div>
            <div class="form-group"><label>Phone</label><input type="text" id="custPhone" placeholder="Phone"></div>
            <div class="form-group"><label>City *</label><input type="text" id="custCity" placeholder="City"></div>
            <div class="form-group"><label>Due Amount</label><input type="number" id="custDue" placeholder="Due amount"></div>
            <div class="form-group"><label>Reference</label><input type="text" id="custReference" placeholder="Reference name"></div>
            <div class="form-group"><label>Promise Date</label><input type="date" id="custPromiseDate"></div>
        </div>
        <div class="modal-footer">
            <button class="add-customer-btn" onclick="saveCustomer()">Save</button>
            <button class="filter-btn" onclick="closeModal()">Cancel</button>
        </div>
    </div>
</div>

<!-- Payment Modal -->
<div class="modal-overlay" id="paymentModal">
    <div class="modal-container">
        <div class="modal-header"><h3>Receive Payment</h3><button class="modal-close" onclick="closePaymentModal()">&times;</button></div>
        <div class="modal-body">
            <div class="form-group"><label>Customer</label><input type="text" id="payCustomerName" readonly></div>
            <div class="form-group"><label>Remaining Due</label><input type="text" id="payRemainingDue" readonly></div>
            <div class="form-group"><label>Amount</label><input type="number" id="payAmount" placeholder="Enter amount"></div>
            <div class="form-group"><label>Payment Method</label><select id="payMethod"><option value="cash">Cash</option><option value="bank">Bank</option></select></div>
        </div>
        <div class="modal-footer">
            <button class="add-customer-btn" onclick="submitPayment()">Pay</button>
            <button class="filter-btn" onclick="closePaymentModal()">Cancel</button>
        </div>
    </div>
</div>

<div id="toast" class="toast"></div>

<script>
// ============ GLOBAL VARIABLES ============
let currentUser = null;
let currentCustomerId = null;
let currentFilter = 'all';
let currentSearch = '';

// ============ LOGIN (Hardcoded) ============
function login() {
    const username = document.getElementById('loginUsername').value;
    const password = document.getElementById('loginPassword').value;
    const role = document.getElementById('loginRole').value;
    
    if ((username === 'admin' && password === 'admin123') || 
        (username === 'user' && password === 'user123')) {
        
        currentUser = {
            username: username,
            fullName: username === 'admin' ? 'Administrator' : 'Staff User',
            role: username,
            roleDisplay: username === 'admin' ? '👑 Admin' : '👤 Staff'
        };
        
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('app').style.display = 'block';
        document.getElementById('userInfo').innerHTML = `
            <i class="fas fa-user-circle"></i>
            <span>${currentUser.fullName}</span>
            <span class="role-badge ${currentUser.role}">${currentUser.roleDisplay}</span>
            <button onclick="logout()" class="logout-btn"><i class="fas fa-sign-out-alt"></i></button>
        `;
        
        if (currentUser.role !== 'admin') {
            document.querySelectorAll('.delete-action, .edit-action').forEach(el => el.style.display = 'none');
        }
        
        loadData();
        showToast('Welcome ' + currentUser.fullName + '!', 'success');
    } else {
        document.getElementById('loginError').style.display = 'block';
        setTimeout(() => document.getElementById('loginError').style.display = 'none', 3000);
    }
}

function logout() {
    currentUser = null;
    document.getElementById('loginScreen').style.display = 'flex';
    document.getElementById('app').style.display = 'none';
    showToast('Logged out', 'success');
}

// ============ API CALLS ============
async function apiCall(endpoint, options = {}) {
    const res = await fetch(`/api${endpoint}`, {
        headers: { 'Content-Type': 'application/json' },
        ...options
    });
    return res.json();
}

// ============ LOAD DATA ============
async function loadData() {
    await loadCustomers();
    await loadStats();
    await loadTodayCollections();
}

async function loadCustomers() {
    try {
        let url = `/customers?filter=${currentFilter}`;
        if (currentSearch) url += `&search=${encodeURIComponent(currentSearch)}`;
        
        const result = await apiCall(url);
        const customers = result.data || [];
        
        const tbody = document.getElementById('customersList');
        if (customers.length === 0) {
            tbody.innerHTML = '<tr><td colspan="8" class="collection-empty">No customers found</td></tr>';
            return;
        }
        
        tbody.innerHTML = customers.map(c => `
            <tr class="${c.remaining_due > 0 ? 'due-row' : ''}">
                <td>#${c.id}</td>
                <td><strong>${escapeHtml(c.name)}</strong></td>
                <td>${escapeHtml(c.cnic || '—')}</td>
                <td>${escapeHtml(c.city || '—')}</td>
                <td>${escapeHtml(c.phone || '—')}</td>
                <td>${escapeHtml(c.reference_name || '—')}</td>
                <td class="${c.remaining_due > 0 ? 'due-amount-value' : ''}">${formatPKR(c.remaining_due)}</td>
                <td class="action-buttons">
                    <button class="action-btn receive-action" onclick="openPaymentModal(${c.id}, '${escapeHtml(c.name)}', ${c.remaining_due})"><i class="fas fa-money-bill-wave"></i></button>
                    ${currentUser?.role === 'admin' ? `
                        <button class="action-btn edit-action" onclick="openEditModal(${c.id})"><i class="fas fa-edit"></i></button>
                        <button class="action-btn delete-action" onclick="deleteCustomer(${c.id})"><i class="fas fa-trash"></i></button>
                    ` : ''}
                </td>
            </tr>
        `).join('');
    } catch (error) {
        console.error('Error loading customers:', error);
    }
}

async function loadStats() {
    const result = await apiCall('/stats');
    const stats = result.data || {};
    document.getElementById('totalCustomers').textContent = stats.totalCustomers || 0;
    document.getElementById('totalAmount').textContent = formatPKR(stats.totalAmount || 0);
    document.getElementById('totalDue').textContent = formatPKR(stats.totalDue || 0);
}

async function loadTodayCollections() {
    const result = await apiCall('/today-collections');
    document.getElementById('todayCollectionTotal').textContent = formatPKR(result.total || 0);
}

// ============ CUSTOMER CRUD ============
async function saveCustomer() {
    const name = document.getElementById('custName').value.trim();
    const city = document.getElementById('custCity').value.trim();
    
    if (!name || !city) {
        showToast('Name and City are required', 'error');
        return;
    }
    
    const customer = {
        name: name,
        cnic: document.getElementById('custCNIC').value,
        phone: document.getElementById('custPhone').value,
        city: city,
        due_amount: parseFloat(document.getElementById('custDue').value) || 0,
        reference_name: document.getElementById('custReference').value,
        promise_date: document.getElementById('custPromiseDate').value,
        entry_date: new Date().toISOString().split('T')[0]
    };
    
    const editId = document.getElementById('editId').value;
    let result;
    
    if (editId) {
        result = await apiCall(`/customers/${editId}`, { method: 'PUT', body: JSON.stringify(customer) });
    } else {
        result = await apiCall('/customers', { method: 'POST', body: JSON.stringify(customer) });
    }
    
    if (result.success) {
        showToast(editId ? 'Customer updated!' : 'Customer added!', 'success');
        closeModal();
        loadData();
    } else {
        showToast('Operation failed', 'error');
    }
}

async function deleteCustomer(id) {
    if (!confirm('Delete this customer?')) return;
    const result = await apiCall(`/customers/${id}`, { method: 'DELETE' });
    if (result.success) {
        showToast('Deleted!', 'success');
        loadData();
    }
}

async function openEditModal(id) {
    const result = await apiCall(`/customers/${id}`);
    const c = result.data;
    if (c) {
        document.getElementById('editId').value = c.id;
        document.getElementById('custName').value = c.name || '';
        document.getElementById('custCNIC').value = c.cnic || '';
        document.getElementById('custPhone').value = c.phone || '';
        document.getElementById('custCity').value = c.city || '';
        document.getElementById('custDue').value = c.due_amount || 0;
        document.getElementById('custReference').value = c.reference_name || '';
        document.getElementById('custPromiseDate').value = c.promise_date || '';
        document.getElementById('customerModal').style.display = 'flex';
    }
}

// ============ PAYMENT ============
function openPaymentModal(id, name, due) {
    currentCustomerId = id;
    document.getElementById('payCustomerName').value = name;
    document.getElementById('payRemainingDue').value = formatPKR(due);
    document.getElementById('paymentModal').style.display = 'flex';
}

async function submitPayment() {
    const amount = parseFloat(document.getElementById('payAmount').value);
    if (!amount || amount <= 0) {
        showToast('Enter valid amount', 'error');
        return;
    }
    
    const payment = {
        customerId: currentCustomerId,
        amount: amount,
        paymentDate: new Date().toISOString().split('T')[0],
        paymentMethod: document.getElementById('payMethod').value
    };
    
    const result = await apiCall('/payments', { method: 'POST', body: JSON.stringify(payment) });
    if (result.success) {
        showToast(`Received ${formatPKR(amount)}`, 'success');
        closePaymentModal();
        loadData();
    } else {
        showToast('Payment failed', 'error');
    }
}

// ============ VOICE SEARCH ============
function startVoiceSearch() {
    const btn = document.getElementById('micBtn');
    if ('webkitSpeechRecognition' in window) {
        const recognition = new webkitSpeechRecognition();
        recognition.lang = 'en-US';
        recognition.start();
        btn.classList.add('listening');
        
        recognition.onresult = (event) => {
            const text = event.results[0][0].transcript;
            document.getElementById('searchInput').value = text;
            currentSearch = text;
            loadCustomers();
            btn.classList.remove('listening');
        };
        
        recognition.onerror = () => {
            btn.classList.remove('listening');
            showToast('Voice search failed', 'error');
        };
    } else {
        showToast('Voice not supported', 'error');
    }
}

// ============ HELPER FUNCTIONS ============
function formatPKR(amount) {
    return 'PKR ' + (amount || 0).toLocaleString();
}

function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
}

function showToast(msg, type) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.style.background = type === 'error' ? '#dc3545' : '#28a745';
    toast.style.display = 'block';
    setTimeout(() => toast.style.display = 'none', 3000);
}

function closeModal() {
    document.getElementById('customerModal').style.display = 'none';
    document.getElementById('editId').value = '';
    document.getElementById('custName').value = '';
    document.getElementById('custCNIC').value = '';
    document.getElementById('custPhone').value = '';
    document.getElementById('custCity').value = '';
    document.getElementById('custDue').value = '';
    document.getElementById('custReference').value = '';
    document.getElementById('custPromiseDate').value = '';
}

function closePaymentModal() {
    document.getElementById('paymentModal').style.display = 'none';
    document.getElementById('payAmount').value = '';
}

// Search & Filter
document.getElementById('searchInput')?.addEventListener('input', (e) => {
    currentSearch = e.target.value;
    loadCustomers();
});

document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        loadCustomers();
    });
});

// Event Listeners
document.getElementById('loginBtn').addEventListener('click', login);
document.getElementById('showAddBtn').addEventListener('click', () => document.getElementById('customerModal').style.display = 'flex');
document.getElementById('micBtn').addEventListener('click', startVoiceSearch);

// Auto check saved session
if (localStorage.getItem('user')) {
    try {
        currentUser = JSON.parse(localStorage.getItem('user'));
        if (currentUser) {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('app').style.display = 'block';
            document.getElementById('userInfo').innerHTML = `
                <i class="fas fa-user-circle"></i>
                <span>${currentUser.fullName}</span>
                <span class="role-badge ${currentUser.role}">${currentUser.roleDisplay}</span>
                <button onclick="logout()" class="logout-btn"><i class="fas fa-sign-out-alt"></i></button>
            `;
            loadData();
        }
    } catch(e) {}
}

// Load data on page load if logged in
if (document.getElementById('app').style.display !== 'none') {
    loadData();
}

// Close modals on outside click
document.querySelectorAll('.modal-overlay').forEach(modal => {
    modal.addEventListener('click', (e) => {
        if (e.target === modal) modal.style.display = 'none';
    });
});
</script>
</body>
</html>
